<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'self'">
  <title>TensorFold Manager</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231a58d6'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-size='15' font-family='sans-serif' fill='white'%3ETF%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div class="tf-layout">
    <header class="tf-topbar">
      <div class="tf-brand"><b>TF</b><span>TensorFold<small>MANAGER <span id="app-version">App 版本未采集</span></small></span></div>
      <nav id="navigation" class="tf-top-nav" aria-label="主导航" data-i18n-aria-label="主导航">
        <button class="tf-nav" data-page="overview" data-i18n="运行总览">运行总览</button>
        <button class="tf-nav" data-page="models" data-i18n="模型库">模型库</button>
        <button class="tf-nav" data-page="activity" data-i18n="活动">活动</button>
        <button class="tf-nav" data-page="settings" data-i18n="设置">设置</button>
        <button class="tf-nav" data-page="chat" data-i18n="内置聊天">内置聊天</button>
      </nav>
      <div class="tf-header-right">
        <span id="poll-status" aria-live="polite"></span>
        <span class="tf-service-indicator"><i id="side-led" class="tf-led muted"></i><span id="side-status" data-i18n="未连接">未连接</span></span>
        <button id="language-toggle" type="button" aria-label="Switch to English" title="Switch to English">文/A</button>
      </div>
    </header>
    <main id="page" tabindex="-1"><div class="tf-loading" data-i18n="正在建立安全连接…">正在建立安全连接…</div></main>
  </div>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <div id="modal" class="tf-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden>
    <div class="tf-dialog">
      <div class="tf-row"><h2 id="modal-title"></h2><button data-action="modal-close" aria-label="关闭" data-i18n-aria-label="关闭">×</button></div>
      <div id="modal-body"></div>
      <div id="modal-actions" class="tf-dialog-actions"><button data-action="modal-close" data-i18n="关闭">关闭</button></div>
    </div>
  </div>
  <script type="module" src="/app.js"></script>
</body>
</html>
