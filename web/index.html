<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'self'">
  <title>TensorFold Manager</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231a58d6'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-size='15' font-family='sans-serif' fill='white'%3ETF%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div class="tf-titlebar">
    <span class="tf-lights" aria-hidden="true"><i></i><i></i><i></i></span>
    TensorFold Manager
    <span id="instance-meta" class="tf-title-meta" data-i18n="正在连接管理服务">正在连接管理服务</span>
  </div>
  <div class="tf-layout">
    <aside>
      <div class="tf-brand"><b>TF</b><span>TensorFold<small>MANAGER</small></span></div>
      <nav id="navigation" aria-label="主导航" data-i18n-aria-label="主导航">
        <div class="tf-nav-group" data-i18n="运行">运行</div>
        <button class="tf-nav" data-page="overview"><span>◫</span><span data-i18n="运行总览">运行总览</span></button>
        <button class="tf-nav" data-page="stats"><span>▥</span><span data-i18n="统计与用量">统计与用量</span></button>
        <button class="tf-nav" data-page="cache"><span>▤</span><span data-i18n="缓存管理">缓存管理</span></button>
        <div class="tf-nav-group" data-i18n="模型">模型</div>
        <button class="tf-nav" data-page="models"><span>▦</span><span data-i18n="模型库">模型库</span></button>
        <button class="tf-nav" data-page="downloads"><span>↓</span><span data-i18n="模型下载器">模型下载器</span></button>
        <button class="tf-nav" data-page="model-config"><span>⚒</span><span data-i18n="模型配置">模型配置</span></button>
        <button class="tf-nav" data-page="model-tools"><span>◇</span><span data-i18n="量化与上传">量化与上传</span></button>
        <div class="tf-nav-group" data-i18n="服务">服务</div>
        <button class="tf-nav" data-page="engine-config"><span>⚙</span><span data-i18n="推理框架配置">推理框架配置</span></button>
        <button class="tf-nav" data-page="server"><span>▣</span><span data-i18n="服务器与目录">服务器与目录</span></button>
        <button class="tf-nav" data-page="api"><span>⌘</span><span data-i18n="API 与集成">API 与集成</span></button>
        <button class="tf-nav" data-page="auth"><span>♧</span><span data-i18n="认证与密钥">认证与密钥</span></button>
        <button class="tf-nav" data-page="updates"><span>↻</span><span data-i18n="版本与更新">版本与更新</span></button>
        <div class="tf-nav-group" data-i18n="工具">工具</div>
        <button class="tf-nav" data-page="logs"><span>≋</span><span data-i18n="运行日志">运行日志</span></button>
        <button class="tf-nav" data-page="benchmark"><span>◷</span><span data-i18n="基准测试">基准测试</span></button>
        <button class="tf-nav" data-page="accuracy"><span>✓</span><span data-i18n="参考答案测试">参考答案测试</span></button>
        <button class="tf-nav" data-page="chat"><span>□</span><span data-i18n="内置聊天">内置聊天</span></button>
        <button class="tf-nav" data-page="capabilities"><span>⊞</span><span data-i18n="功能适配表">功能适配表</span></button>
      </nav>
      <div class="tf-side-bottom">
        <div><i id="side-led" class="tf-led muted"></i><span id="side-status" data-i18n="未连接">未连接</span></div>
        <small id="app-version" data-i18n="App 版本未采集">App 版本未采集</small>
      </div>
    </aside>
    <div class="tf-workspace">
      <header>
        <span id="breadcrumbs">工作台 / 运行总览</span>
        <div class="tf-header-right">
          <span id="poll-status" aria-live="polite"></span>
          <label class="sr-only" for="language-select" data-i18n="界面语言">界面语言</label>
          <select id="language-select" aria-label="界面语言" data-i18n-aria-label="界面语言"><option value="zh-CN">中文</option><option value="en">English</option></select>
          <button data-action="refresh" data-i18n="刷新">刷新</button>
          <button data-page="downloads"><span data-i18n="任务">任务</span> <span id="task-count">0</span></button>
        </div>
      </header>
      <main id="page" tabindex="-1"><div class="tf-loading" data-i18n="正在建立安全连接…">正在建立安全连接…</div></main>
      <footer><span>TensorFold Manager</span><span id="footer-state" data-i18n="管理服务连接中">管理服务连接中</span></footer>
    </div>
  </div>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <div id="modal" class="tf-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden>
    <div class="tf-dialog">
      <div class="tf-row"><h2 id="modal-title"></h2><button data-action="modal-close" aria-label="关闭" data-i18n-aria-label="关闭">×</button></div>
      <div id="modal-body"></div>
      <div id="modal-actions" class="tf-dialog-actions"><button data-action="modal-close" data-i18n="关闭">关闭</button></div>
    </div>
  </div>
  <script type="module" src="/app.js"></script>
</body>
</html>
