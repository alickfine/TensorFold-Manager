name: Build macOS DMG
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned uv and standalone Python
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 -o uv.tar.gz https://github.com/astral-sh/uv/releases/download/0.9.5/uv-aarch64-apple-darwin.tar.gz
          curl --fail --location --proto '=https' --tlsv1.2 -o uv.sha256 https://github.com/astral-sh/uv/releases/download/0.9.5/uv-aarch64-apple-darwin.tar.gz.sha256
          expected=$(awk '{print $1}' uv.sha256)
          actual=$(shasum -a 256 uv.tar.gz | awk '{print $1}')
          test "$expected" = "$actual"
          test "$actual" = "dc098ff224d78ed418e121fd374f655949d2c7031a70f6f6604eaf016a130433"
          tar -xzf uv.tar.gz
          ./uv-aarch64-apple-darwin/uv python install 3.12.9 --no-bin
      - name: Verify backend and Web
        run: |
          runtime=$(./uv-aarch64-apple-darwin/uv python find 3.12.9)
          "$runtime" -m unittest discover -s tests
          node --test tests/web.test.mjs
          swiftc macos/Bootstrap.swift macos/CredentialRequest.swift macos/tests/main.swift -o /tmp/bootstrap-tests
          /tmp/bootstrap-tests
      - name: Build ad hoc test DMG
        run: |
          runtime=$(./uv-aarch64-apple-darwin/uv python find 3.12.9)
          root=$(dirname "$(dirname "$runtime")")
          export TFM_BUILD_VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then export TFM_BUILD_VERSION="0.1.0-alpha.1"; fi
          "$runtime" scripts/build-app.py --runtime "$root" --uv ./uv-aarch64-apple-darwin/uv --output dist/release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: TensorFold-Manager-macOS-arm64-test
          path: |
            dist/release/*.dmg
            dist/release/SHA256SUMS.txt
      - name: Publish tagged test Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --prerelease --title "TensorFold Manager $GITHUB_REF_NAME · 测试版" --notes "Apple Silicon 测试版。Ad hoc 签名，未进行 Apple 公证。首次安装引擎需要联网，模型独立下载。运行能力和验收情况见仓库 docs/acceptance.md。" dist/release/*.dmg dist/release/SHA256SUMS.txt
